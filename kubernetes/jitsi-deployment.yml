apiVersion: v1
kind: ConfigMap
metadata:
  name: jitsi-config
  namespace: katze-backend
data:
  DOCKER_HOST_ADDRESS: "meet.katze.app"
  PUBLIC_URL: "https://meet.katze.app"
  XMPP_DOMAIN: "meet.katze.app"
  XMPP_AUTH_DOMAIN: "auth.meet.katze.app"
  XMPP_BOSH_URL_BASE: "http://jitsi-prosody.katze-backend.svc.cluster.local:5280"
  XMPP_WEBSOCKET: "1"
  ENABLE_XMPP_WEBSOCKET: "1"
  XMPP_MUC_DOMAIN: "muc.meet.katze.app"
  XMPP_INTERNAL_MUC_DOMAIN: "internal-muc.meet.katze.app"
  XMPP_GUEST_DOMAIN: "guest.meet.katze.app"
  XMPP_SERVER: "jitsi-prosody.katze-backend.svc.cluster.local"
  ENABLE_AUTH: "0"
  ENABLE_GUESTS: "1"
  ENABLE_S2S: "1"
  DISABLE_HTTPS: "1"
  ENABLE_HTTP_REDIRECT: "0"
  PROSODY_MODULES: "mod_muc_allowners mod_s2s"
  XMPP_MODULES: "s2s"
  XMPP_CROSS_DOMAIN: "true"
  CONSIDER_BOSH_SECURE: "true"
  CROSS_DOMAIN_BOSH: "true"
  JVB_BREWERY_MUC: "jvbbrewery"
  JVB_PORT: "10000"
  JVB_TCP_HARVESTER_DISABLED: "true"
  ENABLE_LETSENCRYPT: "0"
  LETSENCRYPT_DOMAIN: "meet.katze.app"
  LETSENCRYPT_EMAIL: "admin@katze.app"
  TZ: "Europe/Berlin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-web
  namespace: katze-backend
  labels:
    app: jitsi-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-web
  template:
    metadata:
      labels:
        app: jitsi-web
    spec:
      containers:
        - name: web
          image: jitsi/web:stable-8319
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          envFrom:
            - configMapRef:
                name: jitsi-config
            - secretRef:
                name: jitsi-secrets
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-prosody
  namespace: katze-backend
  labels:
    app: jitsi-prosody
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-prosody
  template:
    metadata:
      labels:
        app: jitsi-prosody
    spec:
      containers:
        - name: prosody
          image: jitsi/prosody:stable-8319
          ports:
            - containerPort: 5222
              name: xmpp
            - containerPort: 5280
              name: bosh
            - containerPort: 5347
              name: component
          envFrom:
            - configMapRef:
                name: jitsi-config
            - secretRef:
                name: jitsi-secrets
          resources:
            limits:
              memory: "256Mi"
              cpu: "300m"
            requests:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-jicofo
  namespace: katze-backend
  labels:
    app: jitsi-jicofo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-jicofo
  template:
    metadata:
      labels:
        app: jitsi-jicofo
    spec:
      containers:
        - name: jicofo
          image: jitsi/jicofo:stable-8319
          envFrom:
            - configMapRef:
                name: jitsi-config
            - secretRef:
                name: jitsi-secrets
          resources:
            limits:
              memory: "256Mi"
              cpu: "300m"
            requests:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jitsi-jvb
  namespace: katze-backend
  labels:
    app: jitsi-jvb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jitsi-jvb
  template:
    metadata:
      labels:
        app: jitsi-jvb
    spec:
      containers:
        - name: jvb
          image: jitsi/jvb:stable-8319
          ports:
            - containerPort: 10000
              protocol: UDP
              name: jvb-udp
            - containerPort: 4443
              protocol: TCP
              name: jvb-tcp
          envFrom:
            - configMapRef:
                name: jitsi-config
            - secretRef:
                name: jitsi-secrets
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: jitsi-web
  namespace: katze-backend
spec:
  selector:
    app: jitsi-web
  ports:
    - protocol: TCP
      port: 80
      name: http
      targetPort: 80
    - protocol: TCP
      port: 443
      name: https
      targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: jitsi-prosody
  namespace: katze-backend
spec:
  selector:
    app: jitsi-prosody
  ports:
    - protocol: TCP
      port: 5222
      name: xmpp
      targetPort: 5222
    - protocol: TCP
      port: 5280
      name: bosh
      targetPort: 5280
    - protocol: TCP
      port: 5347
      name: component
      targetPort: 5347
    - protocol: TCP
      port: 5269
      name: s2s
      targetPort: 5269
---
apiVersion: v1
kind: Service
metadata:
  name: jitsi-jvb
  namespace: katze-backend
spec:
  selector:
    app: jitsi-jvb
  ports:
    - protocol: UDP
      port: 10000
      name: jvb-udp
      targetPort: 10000
    - protocol: TCP
      port: 4443
      name: jvb-tcp
      targetPort: 4443
  type: LoadBalancer